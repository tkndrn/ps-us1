name: Otomatik IPTV Guncelleici

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir otomatik çalışır
  workflow_dispatch:      # İstersen GitHub panelinden tek tıkla manuel de çalıştırabilirsin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install selenium undetected-chromedriver requests

    - name: Scraper Betiğini Çalıştır
      run: python iptv_cekici.py

    - name: Güncel M3U Dosyasını Kaydet ve Push Et
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "bot@actions.github.com"
        git add iptv_listem.m3u
        git commit -m "Otomatik M3U Güncellemesi [skip ci]" || exit 0
        git push
